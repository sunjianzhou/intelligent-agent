# Intelligent Agent CLI Client Configuration
server:
  # Python agent direct URL (no Java backend needed)
  url: "http://localhost:8000"
  # Must match agent/config/settings.py jwt_secret
  jwt_secret: "ABCDEFGHIJKLMNOPQRSTUVWXYZlinmiaoshusheng123"
  # User ID sent in JWT subject (used for per-user model/persona isolation)
  user_id: "cli-user"
  # Request timeout in seconds (CPU inference can take 200-300s)
  timeout: 300

chat:
  use_tools: true
  use_memory: true
  # stream: true = SSE token-by-token; false = wait for full response
  stream: true

data:
  # Directory for session JSON files (relative to this config, or absolute)
  dir: "./datas"
  # Auto-save each session to datas/session_<timestamp>.json
  save_sessions: true
