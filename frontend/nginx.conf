# ── gzip 压缩：大幅减小 SPA bundle/markdown 字符传输体积 ──────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 说明：nginx 的 add_header 是「子级一旦定义就完全替换父级」的规则，
    # 故安全/缓存头必须在每个具体 location 块内显式声明（不能依赖 server 级继承）

    # ── 带 hash 的静态资源长期缓存（必须放在 location / 之前；Vite 构建 assets/* 自带 hash）─
    location /assets/ {
        # 安全头需在每个 location 里重复声明，nginx add_header 不跨级继承
        add_header X-Content-Type-Options "nosniff"    always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Cache-Control          "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # ── SPA 入口（HTML 不缓存，确保前端更新立即生效）──────
    location / {
        # HTML 不缓存：每次都重新拉取，保证发版生效
        add_header X-Content-Type-Options       "nosniff"         always;
        add_header X-Frame-Options              "SAMEORIGIN"      always;
        add_header Referrer-Policy              "no-referrer-when-downgrade" always;
        add_header X-XSS-Protection             "1; mode=block"   always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' ws: wss:;" always;
        add_header Cache-Control                "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 REST 代理 ────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 600s;
        # SSE 流式：禁用缓冲，保证 token 实时下发
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── WebSocket 代理 ────────────────────────────────────────
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── 隐藏 nginx 版本号 ──
    server_tokens off;
}
