ai:
  # 灵魂层目录（SOUL/USER/MEMORY/IDENTITY/HEARTBEAT + 可选 whisper/heart/rules）
  soul:
    dir: ${SOUL_DIR:../../soul}
  llm:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      temperature: ${OLLAMA_TEMPERATURE:0.7}
      max-tokens: ${OLLAMA_MAX_TOKENS:2048}
      top-p: ${OLLAMA_TOP_P:0.9}
      top-k: ${OLLAMA_TOP_K:40}
      repeat-penalty: ${OLLAMA_REPEAT_PENALTY:1.1}
      num-ctx: ${OLLAMA_NUM_CTX:4096}
      num-gpu: ${OLLAMA_NUM_GPU:-1}
      keep-alive: ${OLLAMA_KEEP_ALIVE:-1}
      timeout: ${OLLAMA_TIMEOUT:600s}
    cloud:
      provider: ${CLOUD_PROVIDER:}
      api-key: ${CLOUD_API_KEY:}
      base-url: ${CLOUD_BASE_URL:}
      model: ${CLOUD_MODEL:}
      models: ${CLOUD_MODELS:}
      timeout: ${CLOUD_TIMEOUT:120s}
    # 不支持 Ollama 原生 Function Calling 的模型前缀（逗号分隔）：
    # 命中后走文本工具解析模式，并在 system prompt 末尾追加防退化锚定
    text-tool-patterns: ${TEXT_TOOL_CALLING_PATTERNS:dolphin,phi2,orca-mini,orca2}
    # 上下文 token 预算（与 OLLAMA_NUM_CTX 配合，rules 段在 <4096 时退化为仅 critical）
    max-context-tokens: ${MAX_CONTEXT_TOKENS:8000}
    # LLM 提取（记忆蒸馏 / 项目上下文，TODO-110 Task 5）
    extraction:
      enabled: ${LLM_EXTRACTION_ENABLED:true}
      timeout: ${LLM_EXTRACTION_TIMEOUT:30s}
  # 真实 embedding（Ollama /api/embed，TODO-110 Task 5）
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    model: ${EMBEDDING_MODEL:nomic-embed-text}
    timeout: ${EMBEDDING_TIMEOUT:10s}
  memory:
    # 项目上下文 LLM 提取轮次间隔（与 Python ContextExtractor 每 8 轮一致）
    project-extraction-interval: ${PROJECT_EXTRACTION_INTERVAL:8}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8
    threads:
      # 空闲线程从默认 10 降至 4；峰值从默认 200 降至 80（本地单用户完全够用）
      min-spare: 4
      max: 80
    connection-timeout: 30000

spring:
  application:
    name: intelligent-agent-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: NON_NULL
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      # 静态文件优先：可通过 FRONTEND_DIST 环境变量指定绝对路径
      # 默认从 classpath:/static/（jar 内打包的前端）服务，确保任何机器都能开箱运行
      static-locations: "${FRONTEND_DIST_LOCATION:classpath:/static/}"
      cache:
        period: 3600

# 智能体配置（可通过环境变量覆盖）
intelligent-agent:
  # Java 领域服务数据目录（角色/会话/项目/任务等 JSON 持久化）
  data-dir: ${INTELLIGENT_AGENT_DATA_DIR:data}

logging:
  level:
    com.intelligent.agent: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.springframework.web.socket: WARN
    com.intelligent.agent.web.controller.HealthController: WARN
  file:
    name: logs/intelligent-agent.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CORS 允许来源（多个用逗号分隔）
# 生产环境需通过环境变量 CORS_ALLOWED_ORIGINS 注入具体域名
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"

auth:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 注入强随机密钥（≥32 字符）
    # 无默认值：未设置时服务启动失败，防止使用可预测密钥
    secret: "${JWT_SECRET}"
    expiry-hours: 24
  users:
    - username: admin
      # 生产环境必须通过环境变量 ADMIN_PASSWORD 注入
      password: "${ADMIN_PASSWORD}"

feishu:
  enabled: ${FEISHU_ENABLED:false}
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  encrypt-key: ${FEISHU_ENCRYPT_KEY:}
  verification-token: ${FEISHU_VERIFICATION_TOKEN:}
  bot-open-id: ${FEISHU_BOT_OPEN_ID:}
  # OAuth 回调地址（生产为公网 HTTPS 地址）；测试可注入 mock base
  oauth-base-url: ${FEISHU_OAUTH_BASE_URL:https://open.feishu.cn}
  redirect-uri: ${FEISHU_REDIRECT_URI:}

wecom:
  enabled: ${WECOM_ENABLED:false}
  corp-id: ${WECOM_CORP_ID:}
  agent-id: ${WECOM_AGENT_ID:0}
  secret: ${WECOM_SECRET:}
  token: ${WECOM_TOKEN:}
  aes-key: ${WECOM_AES_KEY:}

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}

comfyui:
  enabled: ${COMFYUI_ENABLED:false}
  base-url: ${COMFYUI_BASE_URL:http://localhost:8188}

image:
  gen:
    provider: ${IMAGE_GEN_PROVIDER:comfyui}
    base-url: ${IMAGE_GEN_BASE_URL:http://localhost:8188}
    model: ${IMAGE_GEN_MODEL:}

# 数据库只读工具（DatabaseTool；未配置时工具不可用但注册）
db:
  type: ${DB_TYPE:}
  host: ${DB_HOST:}
  port: ${DB_PORT:3306}
  database: ${DB_DATABASE:}
  user: ${DB_USER:}
  password: ${DB_PASSWORD:}
