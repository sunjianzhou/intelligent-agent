ai:
  # R-10 成本/用量：per-1m-tokens 为每百万 token 单价（CNY），本地模型默认免费；
  # monthly-limit-cny 为月度成本上限（0 = 不限），超限后拒绝新请求。
  cost:
    enabled: ${AI_COST_ENABLED:true}
    monthly-limit-cny: ${AI_COST_MONTHLY_LIMIT_CNY:0}
    per-1m-tokens: ${AI_COST_PER_1M_TOKENS:{}}
  # 灵魂层目录（SOUL/USER/MEMORY/IDENTITY/HEARTBEAT + 可选 whisper/heart/rules）
  soul:
    dir: ${SOUL_DIR:../../soul}
  llm:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      temperature: ${OLLAMA_TEMPERATURE:0.7}
      max-tokens: ${OLLAMA_MAX_TOKENS:2048}
      top-p: ${OLLAMA_TOP_P:0.9}
      top-k: ${OLLAMA_TOP_K:40}
      repeat-penalty: ${OLLAMA_REPEAT_PENALTY:1.1}
      num-ctx: ${OLLAMA_NUM_CTX:4096}
      num-gpu: ${OLLAMA_NUM_GPU:-1}
      # 前缀缓存：同一 system prompt 前缀复用 KV cache（默认开）
      cache-prompt: ${OLLAMA_CACHE_PROMPT:true}
      # 按模型名下发 num_ctx 的配置表，如 {"qwen2.5:7b":16384,"llama3.1:8b":8192}
      num-ctx-by-model: ${OLLAMA_NUM_CTX_BY_MODEL:{}}
      keep-alive: ${OLLAMA_KEEP_ALIVE:-1}
      timeout: ${OLLAMA_TIMEOUT:600s}
    cloud:
      provider: ${CLOUD_PROVIDER:}
      api-key: ${CLOUD_API_KEY:}
      base-url: ${CLOUD_BASE_URL:}
      model: ${CLOUD_MODEL:}
      models: ${CLOUD_MODELS:}
      timeout: ${CLOUD_TIMEOUT:120s}
    # 不支持 Ollama 原生 Function Calling 的模型前缀（逗号分隔）：
    # 命中后走文本工具解析模式，并在 system prompt 末尾追加防退化锚定
    text-tool-patterns: ${TEXT_TOOL_CALLING_PATTERNS:dolphin,phi2,orca-mini,orca2}
    # 上下文 token 预算（与 OLLAMA_NUM_CTX 配合，rules 段在 <4096 时退化为仅 critical）
    max-context-tokens: ${MAX_CONTEXT_TOKENS:8000}
    # LLM 提取（记忆蒸馏 / 项目上下文，TODO-110 Task 5）
    extraction:
      enabled: ${LLM_EXTRACTION_ENABLED:true}
      timeout: ${LLM_EXTRACTION_TIMEOUT:30s}
    # G6：LLM 熔断器 + SLO（按模型维度；连续失败达阈值 → OPEN，冷却后单次试探）
    circuit-breaker:
      enabled: ${LLM_CIRCUIT_BREAKER_ENABLED:true}
      failure-threshold: ${LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      cooldown: ${LLM_CIRCUIT_BREAKER_COOLDOWN:30s}
      window-size: ${LLM_CIRCUIT_BREAKER_WINDOW_SIZE:100}
    # 推理闸门排队超时：超过后返回"推理繁忙"错误，不再无限期占用等待线程
    inference-queue-timeout: ${LLM_INFERENCE_QUEUE_TIMEOUT:120s}
    # R-02：模型 fallback 链（别名 → 有序模型列表，如 {"default":["qwen2.5:7b","deepseek-chat"]}；
    # 云端条目需在 CLOUD_MODELS / CLOUD_MODEL 中注册）。熔断 OPEN 直接切换，
    # 仅超时/5xx/429 消耗日限额；整链延迟预算上限 60s。
    fallback-chains: ${LLM_FALLBACK_CHAINS:{}}
    fallback:
      budget: ${LLM_FALLBACK_BUDGET:60s}
      daily-limit: ${LLM_FALLBACK_DAILY_LIMIT:50}
    # R-14：图片理解——附图片时校验模型是否支持视觉（关键词 + 显式列表），不支持则给出清晰错误
    vision-check-enabled: ${AI_LLM_VISION_CHECK_ENABLED:true}
    vision-models: ${AI_LLM_VISION_MODELS:[]}
  # 真实 embedding（Ollama /api/embed，TODO-110 Task 5）
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    model: ${EMBEDDING_MODEL:nomic-embed-text}
    timeout: ${EMBEDDING_TIMEOUT:10s}
  memory:
    # 项目上下文 LLM 提取轮次间隔（与 Python ContextExtractor 每 8 轮一致）
    project-extraction-interval: ${PROJECT_EXTRACTION_INTERVAL:8}
  # 流式对话并发上限（WS + SSE 共用；runtime 配置 stream_concurrency 可调）
  chat:
    max-concurrent-streams: ${MAX_CONCURRENT_STREAMS:32}
  # 技能运行时匹配/注入（迁移自 Python skills/manager + applicator）
  skills:
    runtime-enabled: ${AI_SKILLS_RUNTIME_ENABLED:true}
    llm-timeout: ${AI_SKILLS_LLM_TIMEOUT:10s}
  # G6 planning 前置：复杂任务先出计划再执行（启发式门控 + 低温度 LLM 计划生成）
  planning:
    enabled: ${AI_PLANNING_ENABLED:true}
    min-message-length: ${AI_PLANNING_MIN_MESSAGE_LENGTH:24}
    max-steps: ${AI_PLANNING_MAX_STEPS:6}
    timeout: ${AI_PLANNING_TIMEOUT:30s}
  # G6 reflection 后验：工具执行后对草稿答案做一次自检修订（失败保留草稿）
  reflection:
    enabled: ${AI_REFLECTION_ENABLED:true}
    timeout: ${AI_REFLECTION_TIMEOUT:30s}
  # G6 HITL：不可逆工具调用（channel_message）需用户审批（web/WS 渠道；IM 渠道直发）
  hitl:
    enabled: ${AI_HITL_ENABLED:true}
    timeout: ${AI_HITL_TIMEOUT:120s}
  # R-07 子代理编排：复杂计划中可并行步骤由只读研究子代理并行执行，结果按序合并回主对话。
  # tools 为空 = 子代理无工具（纯推理）；默认只读研究工具集。
  subagent:
    enabled: ${AI_SUBAGENT_ENABLED:true}
    pool-size: ${AI_SUBAGENT_POOL_SIZE:4}
    queue-size: ${AI_SUBAGENT_QUEUE_SIZE:32}
    timeout: ${AI_SUBAGENT_TIMEOUT:120s}
    max-rounds: ${AI_SUBAGENT_MAX_ROUNDS:3}
    max-result-chars: ${AI_SUBAGENT_MAX_RESULT_CHARS:2000}
    tools: ${AI_SUBAGENT_TOOLS:web_search,web_fetch,calculator,advanced_calculator,time_tool,system_info,search_memories}
  # G4 导出：OTel OTLP/HTTP（JSON）追踪导出，默认关；
  # 开启后每条 trace 完成时异步推送到 Collector /v1/traces（Jaeger/Tempo/Grafana 等）
  trace:
    export:
      enabled: ${OTEL_EXPORTER_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}
      timeout-ms: ${OTEL_EXPORTER_TIMEOUT_MS:5000}
  # R-03：网页正文抓取工具（WebFetchTool）白名单域名，如 ["example.com"]；空 = 全部拒绝
  web-fetch:
    allowed-domains: ${WEB_FETCH_ALLOWED_DOMAINS:[]}
    timeout-seconds: ${WEB_FETCH_TIMEOUT_SECONDS:10}
    max-body-chars: ${WEB_FETCH_MAX_BODY_CHARS:8000}
  # R-08：文件工具安全目录（绝对路径列表，如 ["D:/workspace/intelligent_agent"]）。
  # file_tool 只读（read/list/info/exists/preview）；file_edit_tool 可写且每次写操作需 HITL 审批。
  # 空列表时：file_tool 默认 home + cwd；file_edit_tool 默认仅 cwd。
  file:
    safe-directories: ${AI_FILE_SAFE_DIRECTORIES:[]}
  file-edit:
    safe-directories: ${AI_FILE_EDIT_SAFE_DIRECTORIES:[]}
  # R-13：轻量指标与告警（断路器打开 / 推理队列满 → 通知队列广播；/api/metrics 聚合）
  metrics:
    enabled: ${AI_METRICS_ENABLED:true}
  alerts:
    enabled: ${AI_ALERTS_ENABLED:true}
    min-interval: ${AI_ALERTS_MIN_INTERVAL:300s}
  # R-16：流式中断恢复——按 requestId 缓存工具轮结果，中断后同 id 重发跳过已执行副作用工具
  checkpoint:
    tool-results-enabled: ${AI_CHECKPOINT_TOOL_RESULTS_ENABLED:true}
    ttl: ${AI_CHECKPOINT_TTL:10m}
    max-entries: ${AI_CHECKPOINT_MAX_ENTRIES:2000}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8
    threads:
      # 空闲线程从默认 10 降至 4；峰值从默认 200 降至 80（本地单用户完全够用）
      min-spare: 4
      max: 80
    connection-timeout: 30000

spring:
  application:
    name: intelligent-agent-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: NON_NULL
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      # REST /api/chat 异步化后，长 LLM 调用（默认 chat_timeout 600s）必须超过容器 30s 默认异步超时
      request-timeout: 660000
  web:
    resources:
      # 静态文件优先：可通过 FRONTEND_DIST 环境变量指定绝对路径
      # 默认从 classpath:/static/（jar 内打包的前端）服务，确保任何机器都能开箱运行
      static-locations: "${FRONTEND_DIST_LOCATION:classpath:/static/}"
      cache:
        period: 3600
  task:
    execution:
      # 默认 applicationTaskExecutor 是 MVC 异步（SSE）的执行器：
      # 限制线程增长，避免高并发 SSE 无限起线程
      pool:
        max-size: 32
        queue-capacity: 200
      thread-name-prefix: mvc-async-

# 智能体配置（可通过环境变量覆盖）
intelligent-agent:
  # Java 领域服务数据目录（角色/会话/项目/任务等 JSON 持久化）
  data-dir: ${INTELLIGENT_AGENT_DATA_DIR:data}

logging:
  level:
    com.intelligent.agent: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.springframework.web.socket: WARN
    com.intelligent.agent.web.controller.HealthController: WARN
  file:
    name: logs/intelligent-agent.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CORS 允许来源（多个用逗号分隔）
# 生产环境需通过环境变量 CORS_ALLOWED_ORIGINS 注入具体域名
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"

auth:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 注入强随机密钥（≥32 字符）
    # 无默认值：未设置时服务启动失败，防止使用可预测密钥
    secret: "${JWT_SECRET}"
    expiry-hours: 24
  users:
    - username: admin
      # 生产环境必须通过环境变量 ADMIN_PASSWORD 注入
      password: "${ADMIN_PASSWORD}"

feishu:
  enabled: ${FEISHU_ENABLED:false}
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  encrypt-key: ${FEISHU_ENCRYPT_KEY:}
  verification-token: ${FEISHU_VERIFICATION_TOKEN:}
  bot-open-id: ${FEISHU_BOT_OPEN_ID:}
  emoji-reaction-enabled: ${FEISHU_EMOJI_REACTION_ENABLED:true}
  # OAuth 回调地址（生产为公网 HTTPS 地址）；测试可注入 mock base
  oauth-base-url: ${FEISHU_OAUTH_BASE_URL:https://open.feishu.cn}
  redirect-uri: ${FEISHU_REDIRECT_URI:}

wecom:
  enabled: ${WECOM_ENABLED:false}
  corp-id: ${WECOM_CORP_ID:}
  agent-id: ${WECOM_AGENT_ID:0}
  secret: ${WECOM_SECRET:}
  token: ${WECOM_TOKEN:}
  aes-key: ${WECOM_AES_KEY:}

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}

comfyui:
  enabled: ${COMFYUI_ENABLED:false}
  base-url: ${COMFYUI_BASE_URL:http://localhost:8188}

image:
  gen:
    provider: ${IMAGE_GEN_PROVIDER:comfyui}
    base-url: ${IMAGE_GEN_BASE_URL:http://localhost:8188}
    model: ${IMAGE_GEN_MODEL:}

# 数据库只读工具（DatabaseTool；未配置时工具不可用但注册）
db:
  type: ${DB_TYPE:}
  host: ${DB_HOST:}
  port: ${DB_PORT:3306}
  database: ${DB_DATABASE:}
  user: ${DB_USER:}
  password: ${DB_PASSWORD:}
