name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run E2E suite (needs Ollama + backend, slow)"
        type: boolean
        default: false
      e2e_model:
        description: "Ollama model for the E2E job (default qwen2.5:1.5b)"
        type: string
        default: "qwen2.5:1.5b"
      run_perf:
        description: "Run perf/baseline suite (needs Ollama + backend, slow)"
        type: boolean
        default: false
      run_eval:
        description: "Run LLM eval suite (needs Ollama + backend, slow)"
        type: boolean
        default: false
      eval_min_score:
        description: "Eval min-score gate (2=protect line, 7=quality gate)"
        type: string
        default: "2"

jobs:
  backend:
    name: Backend (JDK 21 · mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend full test suite
        run: cd backend/web && ./mvnw test

  frontend:
    name: Frontend (Node 22 · vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Unit tests
        run: cd frontend && npm run test
      - name: Production build
        run: cd frontend && npm run build

  e2e:
    name: E2E (Ollama ${{ inputs.e2e_model || 'qwen2.5:1.5b' }})
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 40
    # TD-05（2026-09-17）：从「仅手动 dispatch」改为 push/PR 自动跑。
    # 默认用小模型 qwen2.5:1.5b（约 1GB、CPU 推理快）验证链路；
    # 手动 dispatch 可用 e2e_model 输入换更大模型做质量向回归。
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    env:
      JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef
      ADMIN_PASSWORD: admin123
      E2E_BASE_URL: http://localhost:8080
      E2E_USERNAME: admin
      E2E_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: .ci-ollama
          key: ollama-${{ runner.os }}-${{ inputs.e2e_model || 'qwen2.5:1.5b' }}
      - name: Start Ollama and pull model
        run: |
          mkdir -p .ci-ollama
          docker run -d --name ollama -p 11434:11434 \
            -v "$PWD/.ci-ollama:/root/.ollama" ollama/ollama
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec ollama ollama pull "${{ inputs.e2e_model || 'qwen2.5:1.5b' }}"
          docker exec ollama ollama list
      - name: Start Java backend
        run: |
          cd backend/web
          nohup ./mvnw spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/health
      - name: Run Java E2E suite (replaces retired Python pytest E2E)
        run: cd backend/web && ./mvnw -f ../../tests/e2e-java/pom.xml test
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-e2e
          path: /tmp/backend.log
          if-no-files-found: ignore
      - name: Stop Ollama (flush model cache)
        if: always()
        run: docker stop ollama || true

  perf:
    name: Perf baseline (manual · needs Ollama)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_perf
    env:
      JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef
      ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start Ollama and pull models
        run: |
          docker run -d --name ollama -p 11434:11434 -v ollama:/root/.ollama ollama/ollama
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec ollama ollama pull qwen2.5:7b
          docker exec ollama ollama pull nomic-embed-text
      - name: Start Java backend
        run: |
          cd backend/web
          nohup ./mvnw spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/health
      - name: Run perf suite (health/chat/stream, save CI baseline)
        run: |
          cd backend/web
          ./mvnw -f ../../tests/perf-java/pom.xml test \
            -Dgroups=perf -DexcludedGroups= \
            -Dperf.concurrency=2 -Dperf.healthIterations=200 \
            -Dperf.chatIterations=2 -Dperf.streamIterations=2 \
            -Dperf.saveBaseline=target/perf-report/ci-baseline.json
      - name: Upload perf report
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: tests/perf-java/target/perf-report/*.json

  eval:
    name: Eval suite (manual 路 needs Ollama)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    env:
      JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef
      ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start Ollama and pull models
        run: |
          docker run -d --name ollama -p 11434:11434 -v ollama:/root/.ollama ollama/ollama
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec ollama ollama pull qwen2.5:7b
          docker exec ollama ollama pull nomic-embed-text
      - name: Start Java backend
        run: |
          cd backend/web
          nohup ./mvnw spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/health
      - name: Run eval suite (min-score configurable)
        run: |
          cd backend/web
          ./mvnw -Peval test -Deval.min-score=${{ inputs.eval_min_score }}
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/web/target/eval-results/*.jsonl
