name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run E2E suite (needs Ollama + backend, slow)"
        type: boolean
        default: false

jobs:
  backend:
    name: Backend (JDK 21 · mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend full test suite
        run: cd backend/web && ./mvnw test

  frontend:
    name: Frontend (Node 22 · vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Unit tests
        run: cd frontend && npm run test
      - name: Production build
        run: cd frontend && npm run build

  e2e:
    name: E2E (manual · needs Ollama)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    env:
      JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef
      ADMIN_PASSWORD: admin123
      E2E_BASE_URL: http://localhost:8080
      E2E_USERNAME: admin
      E2E_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start Ollama and pull tool-calling model
        run: |
          docker run -d --name ollama -p 11434:11434 -v ollama:/root/.ollama ollama/ollama
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec ollama ollama pull qwen2.5:7b
      - name: Start Java backend
        run: |
          cd backend/web
          nohup ./mvnw spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/health
      - name: Install E2E dependencies
        run: python -m pip install --quiet pytest httpx
      - name: Run E2E suite
        run: cd tests/e2e && python -m pytest -v
