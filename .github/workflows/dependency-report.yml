name: Dependency report

# TD-14：只读依赖陈旧体检。只产出报告产物，不修改仓库、不自动升级。
# 判读规则见 docs/dependency-audit.md。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *"   # 每月 1 日 02:00 UTC

jobs:
  report:
    name: Outdated dependencies (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven dependency updates
        working-directory: backend/web
        # 有可升级项时该插件不会让构建失败；-Dmaven.repo.local 复用缓存
        run: >
          ./mvnw -B versions:display-dependency-updates
          -DprocessDependencyManagement=true
          | tee "$GITHUB_WORKSPACE/backend-dependency-updates.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm outdated
        working-directory: frontend
        run: |
          npm ci
          # npm outdated 在有旧版本时退出码为 1，这里视为正常
          npm outdated --json > "$GITHUB_WORKSPACE/frontend-outdated.json" || true

      - name: Publish report summary
        run: |
          echo '### Backend: dependencies with newer versions' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/The following dependencies in Dependencies have newer versions/,$p' \
            "$GITHUB_WORKSPACE/backend-dependency-updates.txt" | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '### Frontend: npm outdated' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_WORKSPACE/frontend-outdated.json" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            backend-dependency-updates.txt
            frontend-outdated.json
