services:

  # ── Ollama（本地推理，云端模式不需要，按需启动）──────────────
  # 启动方式：docker-compose --profile local up -d
  ollama:
    profiles: [local]
    image: ollama/ollama:latest
    container_name: ia-ollama
    volumes:
      # 通过 OLLAMA_MODELS_DIR 环境变量指定模型缓存目录（默认使用 docker 命名卷）
      - ${OLLAMA_MODELS_DIR:-ollama_models}:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      # 同时只加载一个模型，避免显存 OOM（多轮切换场景下尤为重要）
      - OLLAMA_MAX_LOADED_MODELS=1
      # 模型闲置 10 分钟后卸载（默认 5min，延长减少冷启动频率）
      - OLLAMA_KEEP_ALIVE=10m
      # CPU 并发推理线程数（CPU offload 层用这些核，i7-10700 建议 4-6）
      - OLLAMA_NUM_PARALLEL=1
      # CPU 线程数：当模型层 offload 到 CPU 时用于矩阵计算
      - OLLAMA_NUM_THREAD=6
    restart: unless-stopped
    networks:
      - ia_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── ComfyUI（本地图片生成，需 GPU，按需启动）──────────────────
  # 启动方式：docker-compose --profile local up -d --build
  # 复用宿主机已有的 ComfyUI 安装目录（含 models/checkpoints、custom_nodes），
  # 首次启动会在容器内安装 python 依赖，耗时较久，之后会跳过。
  comfyui:
    profiles: [local]
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    container_name: ia-comfyui
    volumes:
      - ${COMFYUI_DIR:-D:/software/ComfyUI}:/app
    ports:
      - "8188:8188"
    restart: unless-stopped
    networks:
      - ia_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Java 后端 ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend/web
      dockerfile: Dockerfile
    container_name: ia-backend
    ports:
      - "8080:8080"
    volumes:
      # 灵魂层（soul/）：PromptService 读取 + heart_record 工具写入 rules/heart
      - ${SOUL_DIR:-../../soul}:/app/soul
    env_file:
      - .env.docker
    environment:
      # Python Agent 已于 2026-08-08 退役；Java 后端为唯一服务端
      - SOUL_DIR=/app/soul
      - LOG_LEVEL=INFO
      # 临时诊断飞书长连接是否真的收到帧（含心跳），排查完移除
      - LOGGING_LEVEL_COM_LARK_OAPI=DEBUG
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 未设置}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD 未设置}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      # 飞书 IM 通道：值已通过 env_file（.env.docker）注入，此处不再重复声明
      # （重复声明会用 .env 里的默认值覆盖 env_file 的真实值）
    restart: unless-stopped
    networks:
      - ia_net
    deploy:
      resources:
        limits:
          memory: 512m     # JVM Xmx=400m + 非堆（元空间/JIT）约 100 MB
          cpus: "1.0"      # Spring Boot 轻量网关，1 核足够
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── 前端（Nginx）──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ia-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ia_net
    deploy:
      resources:
        limits:
          memory: 64m      # Nginx 静态文件服务极轻量
          cpus: "0.25"     # Nginx 静态服务极轻，0.25 核绰绰有余
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── ngrok 公网隧道（外网访问，按需启动）────────────────────
  # 启动方式：docker-compose --profile tunnel up -d
  # 使用前在 .env.docker 中设置 NGROK_AUTHTOKEN 和 NGROK_DOMAIN
  # 静态域名：think-roundish-unfold.ngrok-free.dev（绑定到 Java backend:8080）
  ngrok:
    profiles: [tunnel]
    image: ngrok/ngrok:latest
    container_name: ia-ngrok
    command: "http --domain=${NGROK_DOMAIN:-think-roundish-unfold.ngrok-free.dev} backend:8080"
    env_file:
      - .env.docker
    restart: unless-stopped
    networks:
      - ia_net
    depends_on:
      backend:
        condition: service_healthy

  # ── Cloudflare Tunnel（外网访问，按需启动）──────────────────
  # 启动方式：docker-compose --profile tunnel up -d（与 ngrok 二选一）
  # 使用前在 .env.docker 中设置 CLOUDFLARE_TUNNEL_TOKEN=<token>
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: ia-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - ia_net
    depends_on:
      backend:
        condition: service_healthy

  # ── HTTPS 反向代理（可选，按需启动）────────────────────────
  # 使用前先生成自签名证书（开发）或配置 Let's Encrypt（生产）：
  #   sh nginx/generate-certs.sh          # 生成自签名证书
  # 启动方式：docker compose --profile https up -d
  # 访问：https://localhost（浏览器会提示证书不受信任，点"高级→继续"）
  nginx-https:
    profiles: [https]
    image: nginx:alpine
    container_name: ia-nginx-https
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # 生产 Let's Encrypt 证书（需先 certbot --nginx）：
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ia_net

volumes:
  ollama_models:

networks:
  ia_net:
    driver: bridge
    name: intelligent-agent-net
