##############################################################################
# Nginx HTTPS 反向代理配置
#
# 模式 A（默认/本地）：自签名证书，浏览器会警告，仅用于开发
# 模式 B（生产）：替换 ssl_certificate / ssl_certificate_key 路径为
#   Let's Encrypt 证书（certbot --nginx 或 certbot certonly --webroot）
#
# 使用方式：
#   docker compose --profile https up -d
#
# 证书生成（本地自签名，首次启动前执行）：
#   mkdir -p nginx/certs
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout nginx/certs/selfsigned.key \
#     -out    nginx/certs/selfsigned.crt \
#     -subj "/CN=localhost"
##############################################################################

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name _;

    # ── 证书 ─────────────────────────────────────────────────
    # 自签名（开发）：
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    # Let's Encrypt（生产，替换 <domain>）：
    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;

    # ── TLS 配置（OWASP 推荐）────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全响应头 ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # ── WebSocket ────────────────────────────────────────────
    location /ws {
        proxy_pass http://ia-backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600;
    }

    # ── API 代理 → Java 后端 ──────────────────────────────────
    location /api/ {
        proxy_pass http://ia-backend:8080/api/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600;
    }

    # ── 静态文件 → Nginx 前端容器 ────────────────────────────
    location / {
        proxy_pass http://ia-frontend:80;
        proxy_set_header Host $host;
    }
}
